<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Последний просмотр</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #020303;
    color: #a8b0aa;
    font-family: monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

#app {
    width: min(1100px, 94vw);
}

.header {
    display: flex;
    justify-content: space-between;
    color: #657067;
    font-size: 13px;
    margin-bottom: 10px;
}

.camera {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background:
        radial-gradient(circle at 52% 42%, #26352e 0%, #101713 28%, #050706 65%, #010202 100%);
    overflow: hidden;
    border: 1px solid #252d28;
    box-shadow: 0 0 40px #000 inset;
}

.camera::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        repeating-linear-gradient(
            to bottom,
            transparent 0px,
            transparent 3px,
            rgba(255,255,255,.025) 4px
        );
    pointer-events: none;
    z-index: 5;
}

.camera::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse, transparent 45%, rgba(0,0,0,.75));
    pointer-events: none;
    z-index: 4;
}

.road {
    position: absolute;
    left: 25%;
    right: 25%;
    bottom: -10%;
    height: 75%;
    background: linear-gradient(to bottom, #121916, #050606);
    clip-path: polygon(44% 0, 56% 0, 100% 100%, 0 100%);
}

.light {
    position: absolute;
    top: 14%;
    left: 50%;
    width: 16px;
    height: 16px;
    background: #b5c39c;
    border-radius: 50%;
    box-shadow: 0 0 25px 8px rgba(170,190,140,.35);
    transform: translateX(-50%);
}

.light::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 10px;
    width: 170px;
    height: 310px;
    transform: translateX(-50%);
    background: linear-gradient(to bottom, rgba(170,190,140,.12), transparent);
    clip-path: polygon(47% 0, 53% 0, 100% 100%, 0 100%);
}

.fog {
    position: absolute;
    inset: 20% -20%;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(160,180,165,.07),
        transparent
    );
    filter: blur(20px);
    animation: fog 8s linear infinite alternate;
}

@keyframes fog {
    from { transform: translateX(-8%); }
    to { transform: translateX(8%); }
}

.figure {
    position: absolute;
    bottom: 31%;
    left: 50%;
    width: 18px;
    height: 55px;
    background: #020202;
    border-radius: 45% 45% 15% 15%;
    transform: translateX(-50%) scale(1);
    opacity: 0;
    transition: all 2s ease;
    z-index: 3;
}

.figure::before {
    content: "";
    position: absolute;
    width: 20px;
    height: 20px;
    background: #020202;
    border-radius: 50%;
    top: -16px;
    left: -1px;
}

.figure.show {
    opacity: .9;
}

.figure.near {
    transform: translateX(-50%) scale(3.8);
    bottom: 28%;
}

.noise {
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,.025);
    opacity: 0;
    z-index: 6;
    pointer-events: none;
}

.glitch {
    animation: glitch .15s steps(2) 3;
}

@keyframes glitch {
    0% { transform: translate(0); }
    30% { transform: translate(-4px, 2px); }
    60% { transform: translate(4px, -1px); }
    100% { transform: translate(0); }
}

.info {
    margin-top: 10px;
    display: flex;
    justify-content: space-between;
    color: #69736c;
    font-size: 12px;
}

.status {
    color: #9eaa9f;
}

button {
    margin-top: 18px;
    width: 100%;
    padding: 15px;
    background: #080b09;
    border: 1px solid #303a33;
    color: #aab4aa;
    font-family: monospace;
    cursor: pointer;
    letter-spacing: 2px;
}

button:hover {
    background: #101611;
    border-color: #647267;
}

#ending {
    display: none;
    text-align: center;
    padding: 35px 10px;
    color: #c0c8c0;
    letter-spacing: 2px;
}

#ending strong {
    display: block;
    font-size: clamp(20px, 4vw, 34px);
    margin-bottom: 18px;
    color: #d1d8d1;
}

#observer {
    display: none;
    position: fixed;
    inset: 0;
    background: #000;
    color: #9da89f;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: monospace;
    z-index: 100;
}

#observer div {
    max-width: 700px;
    padding: 30px;
}

#observer .big {
    font-size: clamp(20px, 4vw, 40px);
    color: #c6cec7;
    margin-bottom: 25px;
}
</style>
</head>

<body>

<div id="app">

    <div class="header">
        <span>CAMERA 03</span>
        <span id="record">REC ●</span>
    </div>

    <div class="camera" id="camera">
        <div class="road"></div>
        <div class="light"></div>
        <div class="fog"></div>
        <div class="figure" id="figure"></div>
        <div class="noise" id="noise"></div>
    </div>

    <div class="info">
        <span id="time">02:17:43</span>
        <span class="status">ЗАПИСЬ АРХИВА</span>
    </div>

    <button id="rewind">ПЕРЕМОТАТЬ НАЗАД</button>

    <div id="ending">
        <strong>ЗАПИСЬ ОКОНЧЕНА</strong>
        НАБЛЮДАТЕЛЬ ОБНАРУЖЕН.
        <button id="watch">ПОСМОТРЕТЬ, КТО НАБЛЮДАЛ</button>
    </div>

</div>

<div id="observer">
    <div>
        <div class="big">НАБЛЮДАТЕЛЬ ОБНАРУЖЕН</div>
        <div id="finalText">
            Камера больше не смотрит на дорогу.
        </div>
    </div>
</div>

<script>

const rewind = document.getElementById("rewind");
const figure = document.getElementById("figure");
const camera = document.getElementById("camera");
const noise = document.getElementById("noise");
const time = document.getElementById("time");
const ending = document.getElementById("ending");
const watch = document.getElementById("watch");
const observer = document.getElementById("observer");

let step = 0;

rewind.addEventListener("click", () => {

    step++;

    camera.classList.remove("glitch");
    void camera.offsetWidth;
    camera.classList.add("glitch");

    noise.style.opacity = ".25";

    setTimeout(() => {
        noise.style.opacity = "0";
    }, 180);

    if (step === 1) {
        time.textContent = "02:16:58";
        figure.classList.add("show");
    }

    if (step === 2) {
        time.textContent = "02:16:11";
        figure.classList.add("near");
    }

    if (step === 3) {
        time.textContent = "02:15:42";

        setTimeout(() => {
            figure.classList.remove("near");
            figure.style.left = "57%";
        }, 800);
    }

    if (step >= 4) {

        rewind.style.display = "none";

        time.textContent = "--:--:--";
        document.getElementById("record").textContent = "REC OFF";

        setTimeout(() => {
            ending.style.display = "block";
        }, 1800);
    }

});

watch.addEventListener("click", () => {

    observer.style.display = "flex";

    setTimeout(() => {
        document.getElementById("finalText").innerHTML =
        "Последний кадр был записан<br><br>" +
        "<strong>не камерой.</strong>";
    }, 2500);

});

</script>

</body>
</html>
