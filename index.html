<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>АККУРАТНЕЕ — Night Babka</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    background: #030303;
    color: #d0d0d0;
    font-family: Georgia, "Times New Roman", serif;
}

body {
    overflow-x: hidden;
}

/* Фон */

#background {
    position: fixed;
    inset: 0;
    z-index: -2;

    background:
        radial-gradient(
            circle at 50% 40%,
            #181818 0%,
            #080808 45%,
            #020202 100%
        );

    transition: background 4s ease;
}

/* Туман */

#fog {
    position: fixed;
    inset: -30%;
    z-index: -1;

    opacity: 0;

    background:
        radial-gradient(
            ellipse at 30% 60%,
            rgba(150,150,150,0.08),
            transparent 35%
        ),
        radial-gradient(
            ellipse at 70% 45%,
            rgba(150,150,150,0.06),
            transparent 35%
        );

    filter: blur(25px);

    transition: opacity 4s ease;

    animation: fogMove 18s ease-in-out infinite alternate;
}

@keyframes fogMove {
    from {
        transform: translateX(-3%);
    }

    to {
        transform: translateX(3%);
    }
}


/* Основная область */

main {
    width: min(760px, calc(100% - 40px));

    margin: auto;

    padding-top: 18vh;
    padding-bottom: 60vh;
}


/* Night Babka */

.brand {
    font-family: Arial, sans-serif;

    font-size: 12px;

    letter-spacing: 5px;

    color: #555;
}


/* Заголовок */

h1 {
    margin-top: 25px;
    margin-bottom: 18vh;

    font-size: clamp(38px, 9vw, 72px);

    font-weight: normal;

    letter-spacing: 7px;

    color: #cfcfcf;
}


/* Строки истории */

.story-line {

    font-size: clamp(20px, 4.5vw, 29px);

    line-height: 1.85;

    margin-bottom: 1.4em;

    opacity: 0;

    transform: translateY(25px);

    transition:
        opacity 1.8s ease,
        transform 1.8s ease,
        color 2s ease;
}


.story-line.visible {

    opacity: 1;

    transform: translateY(0);
}


/* Особые строки */

.whisper {

    color: #999;

    font-style: italic;
}


.danger {

    color: #aaa;
}


/* Собака */

#dog {

    position: fixed;

    left: 50%;

    bottom: 9vh;

    width: 100px;

    height: 62px;

    background: #050505;

    border-radius: 50%;

    transform:
        translateX(-50%)
        scale(0.7);

    opacity: 0;

    transition:
        opacity 3s ease,
        transform 3s ease;

    box-shadow:
        0 28px 0 -17px #050505;

    z-index: 2;
}


/* Уши */

#dog::before {

    content: "";

    position: absolute;

    width: 30px;
    height: 35px;

    left: 4px;
    top: -13px;

    background: #050505;

    transform: rotate(-25deg);

}


#dog::after {

    content: "";

    position: absolute;

    width: 30px;
    height: 35px;

    right: 4px;
    top: -13px;

    background: #050505;

    transform: rotate(25deg);

}


/* Глаза */

#dog-eyes {

    position: absolute;

    width: 7px;
    height: 7px;

    left: 25px;
    top: 25px;

    background: #777;

    border-radius: 50%;

    box-shadow:
        43px 0 #777,
        0 0 8px #777,
        43px 0 8px #777;
}


/* Появление собаки */

#dog.visible {

    opacity: 0.95;

    transform:
        translateX(-50%)
        scale(1);
}


/* Финальная фраза */

#ending {

    margin-top: 25vh;

    padding-top: 12vh;

    border-top: 1px solid rgba(255,255,255,0.05);

    font-size: clamp(18px, 4vw, 24px);

    line-height: 1.8;

    color: #777;

    opacity: 0;

    transition: opacity 5s ease;
}


#ending.visible {

    opacity: 1;
}
</style>

</head>


<body>


<div id="background"></div>

<div id="fog"></div>

<div id="dog">
    <div id="dog-eyes"></div>
</div>


<main>

    <div class="brand">
        NIGHT BABKA
    </div>


    <h1>
        АККУРАТНЕЕ
    </h1>


    <div id="story"></div>


    <div id="ending">

        P.S. Я тогда ещё не знал,
        кого именно он просил меня остерегаться…

    </div>

</main>


<script>


/* Текст истории */

const story = [

    "Я вышел из-за угла и, идя по двору, навстречу мне быстро прошёл человек.",

    "Я узнал его лицо.",

    "Это было моё лицо.",

    "Он прошёл мимо и шепнул:",

    "— Аккуратнее.",

    "Я обернулся.",

    "В темноте, не сводя с меня мутных глаз и тихо рыча, сидел старый дворовый пёс.",

    "Я замер.",

    "И понял, что страх уже внутри."

];


const storyContainer =
    document.getElementById("story");


const fog =
    document.getElementById("fog");


const dog =
    document.getElementById("dog");


const background =
    document.getElementById("background");


const ending =
    document.getElementById("ending");


/* Вывод текста */

let index = 0;


function showNextLine() {

    if (index >= story.length) {

        setTimeout(() => {

            ending.classList.add("visible");

        }, 3000);

        return;
    }


    const paragraph =
        document.createElement("div");


    paragraph.classList.add("story-line");


    /*
       Особые строки
    */

    if (index === 4) {

        paragraph.classList.add("whisper");

    }


    if (
        index === 1 ||
        index === 2 ||
        index === 7 ||
        index === 8
    ) {

        paragraph.classList.add("danger");

    }


    paragraph.textContent =
        story[index];


    storyContainer.appendChild(
        paragraph
    );


    /* Плавное появление */

    setTimeout(() => {

        paragraph.classList.add("visible");


        paragraph.scrollIntoView({

            behavior: "smooth",

            block: "center"

        });


    }, 100);


    /*
       Постепенно появляется туман
    */

    if (index >= 1) {

        fog.style.opacity = "0.25";

    }


    if (index >= 3) {

        fog.style.opacity = "0.45";

    }


    /*
       После фразы
       "Я обернулся."
    */

    if (index === 5) {

        fog.style.opacity = "0.7";

    }


    /*
       Появление собаки
    */

    if (index === 6) {

        setTimeout(() => {

            dog.classList.add("visible");

        }, 1000);

    }


    /*
       Последняя часть
    */

    if (index >= 7) {

        fog.style.opacity = "0.9";

        background.style.background =
            "#020202";

    }


    index++;


    /*
       Пауза между абзацами
    */

    let delay = 3500;


    /*
       Перед "Аккуратнее"
       делаем паузу подольше
    */

    if (index === 4) {

        delay = 5000;

    }


    /*
       Перед собакой ещё длиннее
    */

    if (index === 6) {

        delay = 5000;

    }


    setTimeout(
        showNextLine,
        delay
    );

}


/*
   Начало истории
*/

setTimeout(
    showNextLine,
    2500
);


</script>


</body>
</html>
