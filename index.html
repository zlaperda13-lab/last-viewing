<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>АККУРАТНЕЕ — Night Babka</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    background: #020202;
    color: #d0d0d0;
}

body {
    font-family: Georgia, "Times New Roman", serif;
    overflow-x: hidden;
}

/* ФОН */

#background {
    position: fixed;
    inset: 0;
    z-index: -5;

    background:
        radial-gradient(
            ellipse at 50% 45%,
            #151515 0%,
            #070707 45%,
            #010101 100%
        );

    transition: 4s ease;
}


/* ТУМАН */

#fog {
    position: fixed;
    inset: -30%;
    z-index: -3;

    opacity: 0;

    background:
        radial-gradient(
            ellipse at 25% 65%,
            rgba(150,150,150,.08),
            transparent 35%
        ),
        radial-gradient(
            ellipse at 75% 45%,
            rgba(130,130,130,.06),
            transparent 35%
        );

    filter: blur(25px);

    transition: opacity 4s ease;

    animation: fogMove 20s ease-in-out infinite alternate;
}

@keyframes fogMove {

    from {
        transform: translateX(-4%);
    }

    to {
        transform: translateX(4%);
    }

}


/* КОНТЕНТ */

main {

    width: min(760px, calc(100% - 40px));

    margin: auto;

    padding-top: 15vh;
    padding-bottom: 60vh;
}


.brand {

    font-family: Arial, sans-serif;

    font-size: 11px;

    letter-spacing: 5px;

    color: #555;

}


h1 {

    margin-top: 22px;

    margin-bottom: 13vh;

    font-size: clamp(38px, 9vw, 70px);

    font-weight: normal;

    letter-spacing: 7px;

    color: #ccc;

}


/* ТЕКСТ */

.story-line {

    font-size: clamp(20px, 4.5vw, 28px);

    line-height: 1.8;

    margin-bottom: 1.15em;

    opacity: 0;

    transform: translateY(12px);

    transition:
        opacity .9s ease,
        transform .9s ease,
        color 1.5s ease;
}


.story-line.visible {

    opacity: 1;

    transform: translateY(0);

}


.whisper {

    color: #888;

    font-style: italic;

}


.danger {

    color: #aaa;

}


/* СЦЕНА С СОБАКОЙ */

#dogScene {

    position: fixed;

    left: 50%;

    bottom: 8vh;

    width: 230px;

    height: 180px;

    transform:
        translateX(-50%)
        translateY(20px)
        scale(.85);

    opacity: 0;

    transition:
        opacity 4s ease,
        transform 4s ease;

    pointer-events: none;

}


#dogScene.visible {

    opacity: .92;

    transform:
        translateX(-50%)
        translateY(0)
        scale(1);

}


/* СИЛУЭТ */

#dog {

    width: 230px;

    height: 180px;

    overflow: visible;

    filter:
        drop-shadow(0 0 5px rgba(0,0,0,.8));

}


/* глаза */

.eye {

    fill: #777;

    filter:
        drop-shadow(0 0 5px #777);

}


/* лёгкое дыхание */

#dogBody {

    transform-origin: 115px 145px;

    animation:
        breathing 4s ease-in-out infinite;

}

@keyframes breathing {

    0%,100% {
        transform: scaleY(1);
    }

    50% {
        transform: scaleY(1.018);
    }

}


/* ФИНАЛ */

#ending {

    margin-top: 22vh;

    padding-top: 10vh;

    border-top:
        1px solid rgba(255,255,255,.05);

    font-size:
        clamp(18px, 4vw, 24px);

    line-height: 1.8;

    color: #666;

    opacity: 0;

    transition:
        opacity 3s ease;

}


#ending.visible {

    opacity: 1;

}


/* затемнение перед финалом */

#darkness {

    position: fixed;

    inset: 0;

    background: #000;

    opacity: 0;

    pointer-events: none;

    transition: opacity 3s ease;

    z-index: 10;

}


#darkness.dark {

    opacity: .35;

}

</style>
</head>


<body>


<div id="background"></div>

<div id="fog"></div>

<div id="darkness"></div>


<!-- СОБАКА -->

<div id="dogScene">

<svg id="dog"
     viewBox="0 0 230 180"
     xmlns="http://www.w3.org/2000/svg">

    <!-- тело -->

    <g id="dogBody"
       fill="#050505"
       stroke="#090909"
       stroke-width="3">

        <!-- туловище -->

        <ellipse
            cx="115"
            cy="130"
            rx="72"
            ry="42"/>


        <!-- грудь -->

        <ellipse
            cx="108"
            cy="110"
            rx="42"
            ry="55"/>


        <!-- голова -->

        <ellipse
            cx="115"
            cy="72"
            rx="48"
            ry="43"/>


        <!-- морда -->

        <ellipse
            cx="115"
            cy="91"
            rx="30"
            ry="23"/>


        <!-- левое ухо -->

        <path
            d="
            M80 48
            Q57 8 68 2
            Q88 10 101 48
            Z"/>


        <!-- правое ухо -->

        <path
            d="
            M150 48
            Q173 8 162 2
            Q142 10 129 48
            Z"/>


        <!-- передняя левая лапа -->

        <path
            d="
            M87 133
            Q78 150 82 174
            L98 174
            L105 137
            Z"/>


        <!-- передняя правая лапа -->

        <path
            d="
            M128 137
            L135 174
            L151 174
            Q155 150 143 133
            Z"/>


        <!-- хвост -->

        <path
            d="
            M175 125
            Q213 112 214 80
            Q214 62 204 65
            Q201 95 173 103
            Z"/>

    </g>


    <!-- глаза -->

    <circle
        class="eye"
        cx="98"
        cy="70"
        r="4"/>

    <circle
        class="eye"
        cx="132"
        cy="70"
        r="4"/>


    <!-- нос -->

    <ellipse
        cx="115"
        cy="91"
        rx="7"
        ry="5"
        fill="#111"/>


</svg>

</div>


<main>

<div class="brand">
    NIGHT BABKA
</div>


<h1>
    АККУРАТНЕЕ
</h1>


<div id="story"></div>


<div id="ending">

P.S. Я тогда ещё не знал,
кого именно он просил меня остерегаться…

</div>

</main>


<script>

/* =========================
   ИСТОРИЯ
========================= */

const story = [

"Я вышел из-за угла и, идя по двору, навстречу мне быстро прошёл человек.",

"Я узнал его лицо.",

"Это было моё лицо.",

"Он прошёл мимо и шепнул:",

"— Аккуратнее.",

"Я обернулся.",

"В темноте, не сводя с меня мутных глаз и тихо рыча, сидел старый дворовый пёс.",

"Я замер.",

"И понял, что страх уже внутри."

];


const storyContainer =
    document.getElementById("story");

const fog =
    document.getElementById("fog");

const dogScene =
    document.getElementById("dogScene");

const ending =
    document.getElementById("ending");

const darkness =
    document.getElementById("darkness");

const background =
    document.getElementById("background");


let index = 0;


/* =========================
   ЗВУК
========================= */

let audioStarted = false;

let audioContext;

let master;

let droneOsc;

let droneGain;


/*
   Запускаем звук после первого
   взаимодействия пользователя.
*/

function startAudio() {

    if (audioStarted) return;

    audioStarted = true;

    audioContext =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();


    master =
        audioContext.createGain();


    master.gain.value = 0.045;


    master.connect(
        audioContext.destination
    );


    /*
       Низкий постоянный гул
    */

    droneOsc =
        audioContext.createOscillator();


    droneGain =
        audioContext.createGain();


    droneOsc.type = "sine";

    droneOsc.frequency.value = 48;

    droneGain.gain.value = 0.35;


    droneOsc.connect(droneGain);

    droneGain.connect(master);

    droneOsc.start();


    /*
       Ещё один очень тихий слой
    */

    const low =
        audioContext.createOscillator();

    const lowGain =
        audioContext.createGain();


    low.type = "triangle";

    low.frequency.value = 72;

    lowGain.gain.value = 0.08;


    low.connect(lowGain);

    lowGain.connect(master);

    low.start();

}


/*
   Тревожный звук
*/

function scaryTone() {

    if (!audioContext) return;


    const osc =
        audioContext.createOscillator();


    const gain =
        audioContext.createGain();


    osc.type = "sawtooth";

    osc.frequency.setValueAtTime(
        110,
        audioContext.currentTime
    );


    osc.frequency.exponentialRampToValueAtTime(
        42,
        audioContext.currentTime + 2.5
    );


    gain.gain.setValueAtTime(
        0,
        audioContext.currentTime
    );


    gain.gain.linearRampToValueAtTime(
        0.25,
        audioContext.currentTime + .8
    );


    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime + 3
    );


    osc.connect(gain);

    gain.connect(master);

    osc.start();

    osc.stop(
        audioContext.currentTime + 3
    );

}


/* =========================
   ПОКАЗ ТЕКСТА
========================= */

function showNextLine() {

    if (index >= story.length) {

        /*
           Перед финалом
        */

        setTimeout(() => {

            scaryTone();

            darkness.classList.add("dark");

        }, 1500);


        setTimeout(() => {

            ending.classList.add("visible");

            darkness.classList.remove("dark");

        }, 4500);


        return;

    }


    const paragraph =
        document.createElement("div");


    paragraph.className =
        "story-line";


    /*
       Шёпот
    */

    if (index === 4) {

        paragraph.classList.add(
            "whisper"
        );

    }


    /*
       Более тяжёлые строки
    */

    if (
        index === 1 ||
        index === 2 ||
        index === 7 ||
        index === 8
    ) {

        paragraph.classList.add(
            "danger"
        );

    }


    paragraph.textContent =
        story[index];


    storyContainer.appendChild(
        paragraph
    );


    setTimeout(() => {

        paragraph.classList.add(
            "visible"
        );


        paragraph.scrollIntoView({

            behavior: "smooth",

            block: "center"

        });

    }, 50);


    /*
       Атмосфера постепенно темнеет
    */

    if (index >= 1) {

        fog.style.opacity = ".25";

    }


    if (index >= 3) {

        fog.style.opacity = ".45";

    }


    /*
       После "Я обернулся"
    */

    if (index === 5) {

        fog.style.opacity = ".7";

    }


    /*
       Появляется собака
    */

    if (index === 6) {

        setTimeout(() => {

            dogScene.classList.add(
                "visible"
            );

            scaryTone();

        }, 700);

    }


    /*
       Последние строки
    */

    if (index >= 7) {

        fog.style.opacity = "1";

        background.style.background =
            "#010101";

    }


    index++;


    /*
       Скорость текста.
       Теперь заметно быстрее.
    */

    let delay = 2200;


    /*
       Перед "Аккуратнее"
       небольшая пауза
    */

    if (index === 4) {

        delay = 3000;

    }


    /*
       Перед появлением собаки
    */

    if (index === 6) {

        delay = 3200;

    }


    setTimeout(
        showNextLine,
        delay
    );

}


/* =========================
   ЗАПУСК
========================= */


/*
   Любое нажатие запускает звук.
*/

document.addEventListener(
    "click",
    startAudio,
    { once: true }
);


/*
   Первый клик по странице
   запускает музыку,
   сама история стартует сразу.
*/

setTimeout(
    showNextLine,
    1200
);

</script>

</body>
</html>
